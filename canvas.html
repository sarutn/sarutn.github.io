<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Air Canvas AI - Fixed Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0f19; user-select: none; font-family: system-ui, sans-serif; }
        #videoElement { display: none; }
        
        /* แก้ไข CSS container ให้แสดงผลเต็มจอไม่มืด */
        .canvas-container { position: relative; width: 100vw; height: 100vh; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #drawingCanvas { z-index: 10; }
        #bgCanvas { z-index: 5; }

        /* วงแหวนโหลดดิ้งรอบนิ้วเวลา Hover ปุ่ม */
        #hoverProgress {
            position: absolute; width: 50px; height: 50px;
            border: 4px solid rgba(255,255,255,0.2); border-top: 4px solid #00f3ff;
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 100; display: none;
        }
    </style>
</head>
<body>

    <div class="canvas-container">
        <video id="videoElement" autoplay playsinline></video>
        <canvas id="bgCanvas"></canvas>
        <canvas id="drawingCanvas"></canvas>
    </div>

    <div id="hoverProgress"></div>

    <div class="absolute top-4 left-1/2 -translate-x-1/2 bg-slate-900/80 backdrop-blur-xl border border-slate-700/50 px-6 py-3 rounded-2xl flex items-center gap-6 shadow-2xl z-50">
        
        <div class="flex items-center gap-3">
            <button class="air-btn w-8 h-8 rounded-full border-2 border-white/40 scale-110 transition-all shadow-[0_0_10px_#00f3ff]" style="background-color: #00f3ff;" data-action="color" data-value="#00f3ff"></button>
            <button class="air-btn w-8 h-8 rounded-full border-2 border-white/40 hover:scale-110 transition-all" style="background-color: #ff007f;" data-action="color" data-value="#ff007f"></button>
            <button class="air-btn w-8 h-8 rounded-full border-2 border-white/40 hover:scale-110 transition-all" style="background-color: #e2ff00;" data-action="color" data-value="#e2ff00"></button>
            <button class="air-btn w-8 h-8 rounded-full border-2 border-white/40 hover:scale-110 transition-all" style="background-color: #00ff66;" data-action="color" data-value="#00ff66"></button>
            <button class="air-btn w-8 h-8 rounded-full border-2 border-white/40 hover:scale-110 transition-all shadow-[0_0_10px_rgba(255,255,255,1)]" style="background-color: #ffffff;" data-action="color" data-value="#ffffff"></button>
        </div>

        <div class="w-px h-6 bg-slate-700"></div>

        <div class="flex items-center gap-2">
            <button class="air-btn flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium" data-action="eraser">
                <i class="fa-solid fa-eraser text-sm text-pink-400"></i> Eraser
            </button>
            <button class="air-btn flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 text-xs font-medium" data-action="clear">
                <i class="fa-solid fa-trash text-sm text-red-400"></i> Clear
            </button>
        </div>

        <div class="w-px h-6 bg-slate-700"></div>

        <button class="air-btn flex items-center gap-2 px-4 py-1.5 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600 text-white text-xs font-bold shadow-lg" data-action="save">
            <i class="fa-solid fa-cloud-arrow-up"></i> Save AI
        </button>
    </div>

    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur border border-slate-700 px-6 py-2 rounded-full text-slate-300 text-xs font-medium shadow-xl z-50">
        <span id="statusText"><i class="fa-solid fa-circle-notch animate-spin mr-2 text-cyan-400"></i>กำลังเริ่มระบบกล้อง AI...</span>
    </div>

    <script>
        // 🔗 ใส่ URL ของ Google Apps Script Web App ของคุณที่นี่
         const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqN58Cyki-niMW8DSBfJ7nWTHIXkJRi2zl8s-es25tTQLNyZEhi6Yfv0IEKNPu2I7b/exec"; 


        const videoElement = document.getElementById('videoElement');
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const drawingCanvas = document.getElementById('drawingCanvas');
        const drawCtx = drawingCanvas.getContext('2d');
        const progressCircle = document.getElementById('hoverProgress');
        const statusText = document.getElementById('statusText');

        let paths = []; 
        let activePaths = {}; 
        let currentColor = '#00f3ff';
        let isEraser = false;

        let currentHoveredElement = null;
        let hoverStartTime = null;
        const HOVER_THRESHOLD = 1000; // แช่นิ้วไว้ 1 วินาทีเต็มวงเพื่อกดปุ่ม

        function resizeCanvases() {
            bgCanvas.width = drawingCanvas.width = window.innerWidth;
            bgCanvas.height = drawingCanvas.height = window.innerHeight;
            renderAllSavedPaths();
        }
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        // --- ตั้งค่าระบบค้นหามือ (รองรับสูงสุด 2 มือพร้อมกัน ซ้าย/ขวา อิสระ) ---
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 1280, height: 720
        });
        camera.start().then(() => { statusText.innerHTML = "✨ พร้อมใช้งาน! แช่นิ้วที่ปุ่มด้านบนเพื่อเลือก | จีบนิ้วชี้-โป้งกลางอากาศเพื่อเริ่มวาด"; });

        // --- LOOP ทำงานหลัก (แก้จุดพังเรียบร้อย) ---
        function onResults(results) {
            bgCtx.save();
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            
            // วาดภาพกล้องสดลงเลเยอร์หลัง
            bgCtx.drawImage(results.image, 0, 0, bgCanvas.width, bgCanvas.height);

            let pointerX = null, pointerY = null;
            let currentFrameHovers = [];

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const landmarks = results.multiHandLandmarks[i];
                    
                    const thumbTip = landmarks[4];
                    const indexTip = landmarks[8];
                    
                    // 1. คำนวณการจีบนิ้วก่อนเรียกใช้งาน (แก้จุดตาย ReferenceError 🎯)
                    const distance = Math.sqrt(Math.pow(thumbTip.x - indexTip.x, 2) + Math.pow(thumbTip.y - indexTip.y, 2));
                    const pinching = distance < 0.045;

                    // 2. วาดโครงกระดูกมือลงบนเลเยอร์หลังอย่างถูกต้อง
                    drawConnectors(bgCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(255,255,255,0.5)', lineWidth: 2});
                    drawLandmarks(bgCtx, landmarks, {color: pinching ? '#ff007f' : '#00f3ff', lineWidth: 1, radius: 4});

                    // พิกัดในระบบ Canvas (สำหรับการวาดเส้น)
                    const x = indexTip.x * drawingCanvas.width;
                    const y = indexTip.y * drawingCanvas.height;

                    // พิกัดในระบบหน้าจอสัมผัสจริๆ (สำหรับตรวจจับการชนปุ่ม UI)
                    const screenX = (1 - indexTip.x) * window.innerWidth;
                    const screenY = indexTip.y * window.innerHeight;

                    // บันทึกพิกัดนิ้วชี้ล่าสุดเพื่อใช้วาดตัวชาร์จวงกลม
                    pointerX = screenX;
                    pointerY = screenY;

                    // เช็คว่านิ้วชี้ไปโดนปุ่มไหนบนจอไหม
                    const hoveredBtn = checkUICollision(screenX, screenY);
                    if (hoveredBtn) currentFrameHovers.push(hoveredBtn);

                    // --- ลอจิกการลากเส้นวาดภาพ ---
                    if (pinching && !hoveredBtn) {
                        if (!activePaths[i]) activePaths[i] = [];
                        activePaths[i].push({x, y});
                    } else {
                        if (activePaths[i] && activePaths[i].length > 0) {
                            paths.push({points: activePaths[i], color: isEraser ? 'erase' : currentColor});
                            activePaths[i] = null;
                        }
                    }
                }
            } else {
                // เคลียร์ค่าเมื่อเอามือออกนอกจอกล้อง
                for (let key in activePaths) {
                    if (activePaths[key]) {
                        paths.push({points: activePaths[key], color: isEraser ? 'erase' : currentColor});
                        activePaths[key] = null;
                    }
                }
            }

            // สั่งอัปเดตเลเยอร์วาดเส้นทั้งหมดในเฟรมนี้ครั้งเดียว (ลื่นไหล ไม่เกิดเส้นเหลี่ยมซ้อนซ้ำ)
            renderAllSavedPaths();

            // รันระบบแช่นิ้วควบคุมปุ่ม UI
            handleHoverEngine(currentFrameHovers, pointerX, pointerY);

            bgCtx.restore();
        }

        // --- 📐 คำนวณความโค้งมนด้วย Bezier Curves ---
        function drawCurve(ctx, points, color) {
            if (points.length < 2) return;
            
            ctx.save();
            ctx.beginPath();
            
            if (color === 'erase') {
                ctx.globalCompositeOperation = 'destination-out'; // ยางลบลบเฉพาะเส้น ไม่กินกล้อง
                ctx.lineWidth = 60;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = color;
                ctx.lineWidth = 8;
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
            }
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length - 1; i++) {
                const xc = (points[i].x + points[i + 1].x) / 2;
                const yc = (points[i].y + points[i + 1].y) / 2;
                ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
            }
            ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
            ctx.stroke();
            ctx.restore();
        }

        function renderAllSavedPaths() {
            drawCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
            // วาดเส้นเก่าที่บันทึกแล้ว
            paths.forEach(p => drawCurve(drawCtx, p.points, p.color));
            // วาดเส้นสดที่มือกำลังลากอยู่ ณ ปัจจุบัน
            for (let key in activePaths) {
                if (activePaths[key] && activePaths[key].length > 0) {
                    drawCurve(drawCtx, activePaths[key], isEraser ? 'erase' : currentColor);
                }
            }
        }

        // --- 🎯 ระบบเช็คพิกัดกล่องปุ่มชนกับปลายนิ้ว ---
        function checkUICollision(sx, sy) {
            const buttons = document.querySelectorAll('.air-btn');
            for (let btn of buttons) {
                const rect = btn.getBoundingClientRect();
                if (sx >= rect.left && sx <= rect.right && sy >= rect.top && sy <= rect.bottom) {
                    return btn;
                }
            }
            return null;
        }

        // --- ⏳ กลไกการแช่นิ้วค้างไว้เพื่อยืนยันคำสั่ง (Air-Hover Engine) ---
        function handleHoverEngine(hoveredButtons, px, py) {
            if (hoveredButtons.length > 0 && px !== null && py !== null) {
                const target = hoveredButtons[0];
                
                if (currentHoveredElement !== target) {
                    currentHoveredElement = target;
                    hoverStartTime = Date.now();
                    progressCircle.style.display = 'block';
                }

                const elapsed = Date.now() - hoverStartTime;
                const percent = Math.min(elapsed / HOVER_THRESHOLD, 1);
                
                // ขยับวงแหวนโหลดดิ้งตามพิกัดนิ้วชี้ของผู้ใช้จริง
                progressCircle.style.left = `${px}px`;
                progressCircle.style.top = `${py}px`;
                progressCircle.style.transform = `translate(-50%, -50%) rotate(${percent * 360}deg)`;

                if (percent >= 1) {
                    executeButtonAction(currentHoveredElement);
                    resetHover();
                }
            } else {
                resetHover();
            }
        }

        function resetHover() {
            currentHoveredElement = null;
            hoverStartTime = null;
            progressCircle.style.display = 'none';
        }

        function executeButtonAction(btn) {
            const action = btn.getAttribute('data-action');
            
            // อนิเมชันปุ่มกระดอนเมื่อกดติดสำเร็จ
            btn.classList.add('scale-90');
            setTimeout(() => btn.classList.remove('scale-90'), 150);

            if (action === 'color') {
                currentColor = btn.getAttribute('data-value');
                isEraser = false;
                document.querySelectorAll('[data-action="color"]').forEach(b => b.style.boxShadow = 'none');
                btn.style.boxShadow = `0 0 15px ${currentColor}`;
                statusText.innerHTML = `🎨 เปลี่ยนสีพู่กันเป็น: <span style="color:${currentColor}">${currentColor}</span>`;
            } else if (action === 'eraser') {
                isEraser = true;
                statusText.innerHTML = "🧹 เปิดใช้งานโหมดยางลบไร้สัมผัส";
            } else if (action === 'clear') {
                paths = [];
                activePaths = {};
                renderAllSavedPaths();
                statusText.innerHTML = "🗑️ ล้างหน้าจอกระดานดำเรียบร้อย";
            } else if (action === 'save') {
                saveAndUploadMasterpiece();
            }
        }

        // --- 💾 ระบบบันทึกภาพผสานเลเยอร์คู่ ---
        function saveAndUploadMasterpiece() {
            statusText.innerHTML = "📸 กำลังประมวลผลถ่ายภาพและบันทึก...";
            
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = drawingCanvas.width;
            finalCanvas.height = drawingCanvas.height;
            const finalCtx = finalCanvas.getContext('2d');
            
            // กลับด้านภาพเซฟให้ปรกติ (ตัวหนังสือไม่อ่านจากหลังไปหน้า)
            finalCtx.translate(finalCanvas.width, 0);
            finalCtx.scale(-1, 1);
            
            // หลอมเลเยอร์กล้องสดกับเส้นวาดนีออนรวมกันเป็นหนึ่งเดียว
            finalCtx.drawImage(bgCanvas, 0, 0);
            finalCtx.drawImage(drawingCanvas, 0, 0);

            const dataUrl = finalCanvas.toDataURL('image/png');

            // ดาวน์โหลดเข้าเครื่องทันที
            const downloadLink = document.createElement('a');
            downloadLink.download = `air-canvas-${Date.now()}.png`;
            downloadLink.href = dataUrl;
            downloadLink.click();
            
            statusText.innerHTML = "💾 บันทึกลงเครื่องแล้ว! กำลังส่งข้อมูลขึ้นคลาวด์ Google Drive...";

            if (APPS_SCRIPT_URL && APPS_SCRIPT_URL !== "ใส่_URL_WEB_APP_APPS_SCRIPT_ตรงนี้") {
                fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: dataUrl })
                })
                .then(() => {
                    statusText.innerHTML = "🎉 สำเร็จ! ไฟล์บันทึกลง Google Drive และ Google Sheets หลังบ้านแล้ว";
                    setTimeout(() => { statusText.innerHTML = "จีบนิ้วเพื่อวาด | แช่นิ้วที่ปุ่มเพื่อเลือกคำสั่ง"; }, 4000);
                })
                .catch(err => {
                    console.error(err);
                    statusText.innerHTML = "⚠️ เซฟลงเครื่องแล้ว แต่การอัปโหลดไป Google Drive ติดขัด";
                });
            } else {
                setTimeout(() => { statusText.innerHTML = "จีบนิ้วเพื่อวาด | แช่นิ้วที่ปุ่มเพื่อเลือกคำสั่ง"; }, 3000);
            }
        }
    </script>
</body>
</html>
