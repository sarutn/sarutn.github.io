<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Air Canvas AI (Google Integrated)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #111; user-select: none; }
        #videoElement { display: none; }
        #outputCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror หน้าจอให้เหมือนกระจก */
        }
        #fingerCursor {
            position: absolute;
            width: 20px; height: 20px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 15px currentColor;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }
        #fingerCursor.pinching { width: 12px; height: 12px; background-color: currentColor; }
        .air-btn { transition: all 0.2s; position: relative; overflow: hidden; }
        .air-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; height: 100%; width: 0%;
            background: rgba(255, 255, 255, 0.2);
            transition: width 0.1s linear;
        }
        .air-btn.hovering::after { width: 100%; transition: width 1s linear; }
    </style>
</head>
<body>

    <video id="videoElement" autoplay playsinline></video>
    <canvas id="outputCanvas"></canvas>
    <div id="fingerCursor" style="color: #00f3ff; display: none;"></div>

    <div class="absolute top-0 left-0 h-full w-24 sm:w-32 bg-white/10 backdrop-blur-md border-r border-white/20 flex flex-col items-center py-8 gap-6 shadow-2xl z-50">
        <div class="flex flex-col gap-4">
            <button class="air-btn w-12 h-12 rounded-full shadow-lg border-2 border-white/50" style="background-color: #00f3ff;" data-action="color" data-value="#00f3ff"></button>
            <button class="air-btn w-12 h-12 rounded-full shadow-lg border-2 border-white/50" style="background-color: #ff007f;" data-action="color" data-value="#ff007f"></button>
            <button class="air-btn w-12 h-12 rounded-full shadow-lg border-2 border-white/50" style="background-color: #e2ff00;" data-action="color" data-value="#e2ff00"></button>
            <button class="air-btn w-12 h-12 rounded-full shadow-lg border-2 border-white/50" style="background-color: #00ff66;" data-action="color" data-value="#00ff66"></button>
        </div>

        <div class="w-10 h-px bg-white/30 my-2"></div>

        <button class="air-btn flex flex-col items-center justify-center w-16 h-16 rounded-xl bg-gray-800/80 text-white shadow-lg border border-white/20" data-action="eraser">
            <i class="fa-solid fa-eraser text-xl mb-1"></i>
            <span class="text-[10px]">Eraser</span>
        </button>

        <button class="air-btn flex flex-col items-center justify-center w-16 h-16 rounded-xl bg-red-500/80 text-white shadow-lg border border-white/20" data-action="clear">
            <i class="fa-solid fa-trash text-xl mb-1"></i>
            <span class="text-[10px]">Clear</span>
        </button>

        <div class="flex-grow"></div>

        <button class="air-btn flex flex-col items-center justify-center w-16 h-16 rounded-xl bg-green-500/90 text-white shadow-lg border border-white/20" data-action="save">
            <i class="fa-solid fa-cloud-arrow-up text-xl mb-1"></i>
            <span class="text-[10px]">Save AI</span>
        </button>
    </div>

    <div class="absolute top-6 right-6 bg-black/60 backdrop-blur px-6 py-3 rounded-full border border-white/10 text-white flex items-center gap-3 z-50">
        <i class="fa-solid fa-hand-sparkles text-cyan-400"></i>
        <span id="statusText" class="text-sm font-medium">กำลังเตรียมกล้อง...</span>
    </div>

    <script>
        // ==========================================
        // 🔗 วาง URL ของ Google Apps Script Web App ตรงนี้ครับ
        // ==========================================
        //const APPS_SCRIPT_URL = "ใส่_URL_WEB_APP_APPS_SCRIPT_ตรงนี้"; 
         // --- ส่วนตั้งค่าหลัก (CONFIG) ---
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqN58Cyki-niMW8DSBfJ7nWTHIXkJRi2zl8s-es25tTQLNyZEhi6Yfv0IEKNPu2I7b/exec"; 

        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('outputCanvas');
        const canvasCtx = canvasElement.getContext('2d');
        const cursor = document.getElementById('fingerCursor');
        const statusText = document.getElementById('statusText');

        let isDrawing = false;
        let paths = []; 
        let currentPath = [];
        let currentColor = '#00f3ff';
        let isEraser = false;

        let hoverTarget = null;
        let hoverTimer = null;
        const HOVER_TIME = 1000; 

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- Setup MediaPipe Hands ---
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 1280,
            height: 720
        });
        camera.start().then(() => { statusText.innerText = "จีบนิ้วเพื่อวาด | ชี้ค้างที่ปุ่มเพื่อเลือก"; });

        // --- Main Loop ---
        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            let indexX = 0, indexY = 0;
            let pinching = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                cursor.style.display = 'block';
                const landmarks = results.multiHandLandmarks[0];
                
                // วาดโครงกระดูกมือจริงแบบในตัวอย่างโปรๆ
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#ffffff', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#00f3ff', lineWidth: 1, radius: 3});

                const thumb = landmarks[4];
                const index = landmarks[8];
                const distance = Math.sqrt(Math.pow(thumb.x - index.x, 2) + Math.pow(thumb.y - index.y, 2));
                
                pinching = distance < 0.05; // เช็คการจีบนิ้วโป้ง-ชี้

                indexX = (1 - index.x) * window.innerWidth;
                indexY = index.y * window.innerHeight;

                cursor.style.left = `${indexX}px`;
                cursor.style.top = `${indexY}px`;
                cursor.style.color = isEraser ? '#ffffff' : currentColor;
                
                if (pinching) {
                    cursor.classList.add('pinching');
                } else {
                    cursor.classList.remove('pinching');
                }

                if (pinching) {
                    // ไม่ให้วาดรูปทะลุไปโดนแถบเมนูข้างซ้าย
                    if (indexX > document.querySelector('.w-24, .sm\\:w-32').offsetWidth) {
                        if (!isDrawing) {
                            isDrawing = true;
                            currentPath = [];
                        }
                        currentPath.push({x: index.x * canvasElement.width, y: index.y * canvasElement.height, color: isEraser ? 'erase' : currentColor});
                    }
                } else {
                    if (isDrawing) {
                        isDrawing = false;
                        if (currentPath.length > 0) paths.push([...currentPath]);
                    }
                }

                checkVirtualUIHover(indexX, indexY);
                
            } else {
                cursor.style.display = 'none';
                if (isDrawing) {
                    isDrawing = false;
                    if (currentPath.length > 0) paths.push([...currentPath]);
                }
                clearHover();
            }

            drawAllPaths();
            canvasCtx.restore();
        }

        function drawAllPaths() {
            const drawPath = (pathData) => {
                if (pathData.length < 2) return;
                canvasCtx.beginPath();
                canvasCtx.moveTo(pathData[0].x, pathData[0].y);
                for (let i = 1; i < pathData.length; i++) {
                    canvasCtx.lineTo(pathData[i].x, pathData[i].y);
                }
                
                if (pathData[0].color === 'erase') {
                    canvasCtx.globalCompositeOperation = 'destination-out';
                    canvasCtx.lineWidth = 40;
                    canvasCtx.stroke();
                    canvasCtx.globalCompositeOperation = 'source-over';
                } else {
                    canvasCtx.strokeStyle = pathData[0].color;
                    canvasCtx.lineWidth = 8;
                    canvasCtx.lineCap = 'round';
                    canvasCtx.lineJoin = 'round';
                    canvasCtx.shadowBlur = 15;
                    canvasCtx.shadowColor = pathData[0].color;
                    canvasCtx.stroke();
                    canvasCtx.shadowBlur = 0;
                }
            };

            paths.forEach(drawPath);
            if (currentPath.length > 0) drawPath(currentPath);
        }

        // --- ระบบไร้สัมผัส Hover UI ---
        function checkVirtualUIHover(x, y) {
            cursor.style.visibility = 'hidden';
            const element = document.elementFromPoint(x, y);
            cursor.style.visibility = 'visible';

            const btn = element ? element.closest('.air-btn') : null;

            if (btn) {
                if (hoverTarget !== btn) {
                    clearHover();
                    hoverTarget = btn;
                    hoverTarget.classList.add('hovering');
                    
                    hoverTimer = setTimeout(() => {
                        triggerAction(hoverTarget);
                        clearHover();
                        btn.style.transform = 'scale(0.9)';
                        setTimeout(() => btn.style.transform = 'scale(1)', 150);
                    }, HOVER_TIME);
                }
            } else {
                clearHover();
            }
        }

        function clearHover() {
            if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }
            if (hoverTarget) { hoverTarget.classList.remove('hovering'); hoverTarget = null; }
        }

        function triggerAction(btn) {
            const action = btn.getAttribute('data-action');
            if (action === 'color') {
                currentColor = btn.getAttribute('data-value');
                isEraser = false;
                statusText.innerText = 'เปลี่ยนสีสำเร็จ';
            } else if (action === 'eraser') {
                isEraser = true;
                statusText.innerText = 'เปิดใช้งานยางลบ';
            } else if (action === 'clear') {
                paths = []; currentPath = [];
                statusText.innerText = 'ล้างหน้าจอแล้ว';
            } else if (action === 'save') {
                saveAndUploadImage();
            }
        }

        // --- ระบบผสานร่าง Save ลงเครื่อง + ส่งไป Google Drive/Sheet ---
        function saveAndUploadImage() {
            statusText.innerText = 'กำลังประมวลผลเซฟภาพ...';
            
            // สร้าง Canvas สำรองเพื่อกลับด้านรูปให้ถูกต้องก่อนส่งเซฟ (แก้ปัญหาภาพสลับซ้ายขวา)
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvasElement.width;
            tempCanvas.height = canvasElement.height;
            const tempCtx = tempCanvas.getContext('2d');
            
            tempCtx.translate(tempCanvas.width, 0);
            tempCtx.scale(-1, 1);
            tempCtx.drawImage(canvasElement, 0, 0);

            const dataUrl = tempCanvas.toDataURL('image/png');

            // 1. ดาวน์โหลดลงเครื่องทันที (Local Copy เพื่อความมั่นใจของผู้ใช้)
            const link = document.createElement('a');
            link.download = `air-canvas-${Date.now()}.png`;
            link.href = dataUrl;
            link.click();
            
            statusText.innerText = 'บันทึกลงเครื่องแล้ว 💾 กำลังส่งไป Google Drive...';

            // 2. ส่งข้อมูลภาพขึ้น Cloud (Google Apps Script)
            if (APPS_SCRIPT_URL && APPS_SCRIPT_URL !== "ใส่_URL_WEB_APP_APPS_SCRIPT_ตรงนี้") {
                fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // เปิดโหมดข้ามโดเมนสำหรับไอแพด/มือถือ
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: dataUrl })
                })
                .then(() => {
                    statusText.innerText = 'เซฟลง Google Drive & Sheet เรียบร้อย! 🎉';
                    setTimeout(() => { statusText.innerText = "จีบนิ้วเพื่อวาด | ชี้ค้างที่ปุ่มเพื่อเลือก"; }, 4000);
                })
                .catch(err => {
                    console.error(err);
                    statusText.innerText = 'ส่งไป Google Drive ไม่สำเร็จ แต่เซฟลงเครื่องแล้ว';
                });
            } else {
                statusText.innerText = 'เซฟลงเครื่องสำเร็จ (ยังไม่ได้ผูก URL Apps Script)';
                setTimeout(() => { statusText.innerText = "จีบนิ้วเพื่อวาด | ชี้ค้างที่ปุ่มเพื่อเลือก"; }, 3000);
            }
        }
    </script>
</body>
</html>
