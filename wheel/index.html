<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>วงล้อสุ่มรางวัล กิจกรรม Let's Hunt Mini</title>
  <!-- Tailwind CSS, Canvas Confetti & SheetJS for Excel -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; }
    
    .water-bg {
      background: linear-gradient(135deg, #0b192c 0%, #1e3e62 50%, #000000 100%);
    }

    /* เข็มหมุด GIS เด้งเมื่อโดนซี่วงล้อ */
    .pin-pointer {
      transform-origin: top center;
      transition: transform 0.05s ease-out;
    }
    .pin-hit {
      animation: pinFlick 0.12s ease-in-out;
    }
    @keyframes pinFlick {
      0% { transform: translateX(-50%) rotate(0deg); }
      40% { transform: translateX(-50%) rotate(-18deg) translateY(-4px); }
      100% { transform: translateX(-50%) rotate(0deg) translateY(0); }
    }

    /* Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #0284c7; border-radius: 4px; }

    /* Dragging Style */
    .draggable-item { cursor: grab; }
    .draggable-item:active { cursor: grabbing; }
    .dragging { opacity: 0.4; border: 2px dashed #38bdf8; }

    /* LED Lights Glow */
    .led-dot {
      transition: background-color 0.1s ease, box-shadow 0.1s ease;
    }
  </style>
</head>
<body class="water-bg text-white h-screen w-screen overflow-hidden flex flex-col items-center justify-between p-4 relative select-none">

  <!-- ==================== HEADER ==================== -->
  <header class="z-10 text-center mt-2 sm:mt-4">

      <span class="animate-pulse text-red-500">📍</span>
      <span class="text-xs sm:text-sm font-semibold tracking-wider text-cyan-300 uppercase">GIS LOCATION HUNTING</span>
    </div> -->
    <h1 id="wheelTitle" contenteditable="true" 
        class="text-2xl sm:text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-200 to-blue-400 cursor-pointer hover:opacity-90 transition-all drop-shadow-[0_2px_10px_rgba(56,189,248,0.3)]"
        title="คลิกเพื่อแก้ไขหัวข้อ">
      วงล้อสุ่มรางวัล LET'S HUNT MINI

        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />

  <!-- ==================== MAIN FULLSCREEN WHEEL SECTION ==================== -->
  <main class="flex-1 w-full flex flex-col items-center justify-center relative my-auto overflow-hidden">

    <div id="wheelContainer" class="relative flex items-center justify-center transition-all duration-300" style="width: 700px; height: 700px;">
      
      <!-- เข็มชี้รางวัลรูป "หมุด GIS" -->

    <div class="bg-slate-900 border border-cyan-500/40 rounded-3xl p-5 sm:p-6 max-w-2xl w-full shadow-2xl relative max-h-[92vh] flex flex-col">
      
      <!-- Modal Header -->

        <h2 class="text-lg sm:text-xl font-bold text-cyan-400 flex items-center gap-2">
          <span>⚙️</span> ตั้งค่าขนาด, รายการรางวัล

            <input type="range" id="fontSizeInput" min="70" max="150" step="5" value="130"

      <!-- Excel Import / Export & Preset Bar -->

            <input type="color" id="itemColor" value="#0284C7"

        <button type="submit"

      <!-- คำอธิบาย & ปุ่ม Random -->

        <button onclick="smartShuffleItems()"

          <span>🔀</span> สุ่มสลับตำแหน่ง

      <!-- รายการทั้งหมด (Drag and Drop List) -->
      <div class="flex-1 overflow-y-auto pr-1 space-y-2 custom-scrollbar min-h-[140px]" id="itemList">

      </div>

      <!-- Footer Modal -->

        <button onclick="toggleConfigModal()" class="bg-slate-800 hover:bg-slate-700 text-cyan-300 px-4 py-1.5 rounded-xl text-sm font-semibold">

  <!-- ==================== MODAL: RESULT ==================== -->
  <div id="resultModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border-2 border-cyan-400 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-[0_0_50px_rgba(6,182,212,0.4)] transform transition-all scale-95 opacity-0" id="modalCard">

      <button onclick="closeModal()"

        หมุนต่อ

  <!-- ==================== JAVASCRIPT ==================== -->
  <script>
    // รายการ Default โหลดตรงจากไฟล์ Excel (Wheel_Prizes_Config (1).xlsx)
    const DEFAULT_ITEMS = [
      { id: 1786944512492, name: '🖊️ ปากกา', weight: 3, color: '#c5e3f2', lockPercent: -1.0 },
      { id: 1, name: '🔑 พวงกุญแจ', weight: 4, color: '#ff99fc', lockPercent: -1.0 },
      { id: 2, name: '🖊️ ปากกา', weight: 4, color: '#06B6D4', lockPercent: -1.0 },
      { id: 3, name: '🧸 ตุ๊กตา', weight: 2, color: '#ffe229', lockPercent: 0.5 },
      { id: 5, name: '🖊️ ปากกา', weight: 4, color: '#2563EB', lockPercent: -1.0 },
      { id: 4, name: '👾 ทามาก๊อต', weight: 3, color: '#0af58f', lockPercent: -1.0 },
      { id: 7, name: '🖊️ ปากกา', weight: 2, color: '#7C3AED', lockPercent: -1.0 },
      { id: 6, name: '🧑‍🚀 พัดลมนักบิน', weight: 2, color: '#a1a3a5', lockPercent: -1.0 },
      { id: 9, name: '🖊️ ปากกา', weight: 3, color: '#3B82F6', lockPercent: -1.0 },
      { id: 10, name: '🧷 เข็มกลัด', weight: 4, color: '#38641b', lockPercent: -1.0 },
      { id: 11, name: '🖊️ ปากกา', weight: 4, color: '#14B8A6', lockPercent: -1.0 },
      { id: 8, name: '🌬️ พัดลมพกพา', weight: 4, color: '#EC4899', lockPercent: -1.0 },
      { id: 13, name: '🖊️ ปากกา', weight: 3, color: '#6366F1', lockPercent: -1.0 },
      { id: 12, name: '🎙️ เครื่องบันทึกเสียง', weight: 3, color: '#F97316', lockPercent: -1.0 },
      { id: 15, name: '🖊️ ปากกา', weight: 2, color: '#0984E3', lockPercent: -1.0 },
      { id: 14, name: '👜 กระเป๋าผ้า', weight: 2, color: '#EF4444', lockPercent: -1.0 }
    ];

    let items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
    let isSpinning = false;
    let currentRotation = 0;
    let selectedItem = null;
    let audioEnabled = true;
    
    // ตั้งค่าขนาดวงล้อและฟอนต์
    let currentWheelSize = 800;
    let fontScale = 1.0;

    // Web Audio Synthesizer
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // ฟังก์ชันสลับระหว่าง Fullscreen และ Exit Fullscreen
    function toggleFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen();
        } else if (docEl.webkitRequestFullscreen) { /* Safari */
          docEl.webkitRequestFullscreen();
        } else if (docEl.msRequestFullscreen) { /* IE11 */
          docEl.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) { /* Safari */
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) { /* IE11 */
          document.msExitFullscreen();
        }
      }
    }

    // อัปเดตไอคอนบนปุ่มให้อัตโนมัติตามสถานะจริง (รองรับการกด Esc บนคีย์บอร์ดด้วย)
    function updateFullscreenIcons() {
      const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
      const iconText = document.getElementById('fullscreenIconText');
      const btn = document.getElementById('fullscreenBtn');

      if (isFS) {
        iconText.innerText = '🗗'; // หรือ ✖
        btn.setAttribute('title', 'ยกเลิกเต็มหน้าจอ (Exit Fullscreen)');
      } else {
        iconText.innerText = '⛶'; // หรือ ⛶
        btn.setAttribute('title', 'แสดงเต็มหน้าจอ (Fullscreen)');
      }
    }

    // ผูก Event Listener เมื่อมีการเปลี่ยนแปลงสถานะหน้าจอ
    document.addEventListener('fullscreenchange', updateFullscreenIcons);
    document.addEventListener('webkitfullscreenchange', updateFullscreenIcons);
    document.addEventListener('msfullscreenchange', updateFullscreenIcons);


    function playTickSound() {
      if (!audioEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
      } catch (e) {}
    }

    function playWinSound() {
      if (!audioEnabled) return;
      try {
        initAudio();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.1 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.1);
          osc.stop(audioCtx.currentTime + idx * 0.1 + 0.3);
        });
      } catch (e) {}
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('audioBtn').innerText = audioEnabled ? '🔊' : '🔇';
    }

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');

    // สลับขนาดวงล้อสด (Wheel Size Changer)
    function changeWheelSize(val) {
      currentWheelSize = Number(val);
      const container = document.getElementById('wheelContainer');
      container.style.width = `${currentWheelSize}px`;
      container.style.height = `${currentWheelSize}px`;
      document.getElementById('wheelSizeVal').innerText = `${currentWheelSize} px`;
      drawWheel();
    }

    // ปรับตัวคูณขนาดฟอนต์ (Font Scale Changer)
    function changeFontSize(val) {
      fontScale = Number(val) / 100;
      document.getElementById('fontSizeVal').innerText = `${val}%`;
      drawWheel();
    }

    // สร้าง LED Bulbs รอบขอบวงล้อ
    function initLEDs() {
      const container = document.getElementById('ledContainer');
      container.innerHTML = '';
      const totalLEDs = 24;
      for (let i = 0; i < totalLEDs; i++) {
        const angle = (i / totalLEDs) * Math.PI * 2;
        const radiusPercent = 48.5; 
        const x = 50 + radiusPercent * Math.cos(angle);
        const y = 50 + radiusPercent * Math.sin(angle);
        
        const dot = document.createElement('div');
        dot.className = 'led-dot absolute w-3 h-3 sm:w-3.5 sm:h-3.5 rounded-full border border-slate-900 shadow-md';
        dot.style.left = `${x}%`;
        dot.style.top = `${y}%`;
        dot.style.transform = 'translate(-50%, -50%)';
        dot.style.backgroundColor = i % 2 === 0 ? '#38bdf8' : '#f59e0b';
        container.appendChild(dot);
      }
    }
    initLEDs();

    function updateLEDs(spinning, winning = false) {
      const dots = document.querySelectorAll('.led-dot');
      dots.forEach((dot, i) => {
        if (winning) {
          dot.style.backgroundColor = Math.random() > 0.5 ? '#f59e0b' : '#38bdf8';
          dot.style.boxShadow = '0 0 12px #f59e0b';
        } else if (spinning) {
          const active = Math.floor(Date.now() / 80 + i) % 3 === 0;
          dot.style.backgroundColor = active ? '#38bdf8' : '#1e293b';
          dot.style.boxShadow = active ? '0 0 8px #38bdf8' : 'none';
        } else {
          dot.style.backgroundColor = i % 2 === 0 ? '#0284c7' : '#d97706';
          dot.style.boxShadow = '0 0 4px rgba(0,0,0,0.5)';
        }
      });
    }

    // ----------------------------------------------------
    // 1. วาดวงล้อ (Draw Wheel) + Font Size Maximizer
    // ----------------------------------------------------
    function drawWheel() {
      const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 20;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (items.length === 0) {
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 28px Kanit';
        ctx.textAlign = 'center';
        ctx.fillText('โปรดเพิ่มรายการในปุ่มตั้งค่า ⚙️', centerX, centerY);
        return;
      }

      let startAngle = currentRotation;

      // คำนวณขนาดฟอนต์ฐาน (Base Font Size) ให้อัตโนมัติตามจำนวนรายการ และปรับขยายด้วย fontScale
      // รายการยิ่งเยอะ ฟอนต์จะปรับขนาดให้พอดีไม่ล้นช่อง
      const baseFontSize = Math.max(16, Math.min(32, Math.floor(400 / items.length)));
      const finalFontSize = Math.floor(baseFontSize * fontScale);

      items.forEach((item) => {
        const sliceAngle = (item.weight / totalWeight) * (Math.PI * 2);
        const endAngle = startAngle + sliceAngle;

        // วาดชิ้นส่วน
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = item.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#0f172a';
        ctx.stroke();

        // วาดข้อความขนาดใหญ่
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#FFFFFF';
        
        // Font Bolder & Drop Shadow ให้เห็นชัดมาก
        ctx.font = `800 ${finalFontSize}px Kanit, sans-serif`;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.95)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;
        
        let text = item.name;
        if (text.length > 20) text = text.substring(0, 18) + '...';
        ctx.fillText(`${text}`, radius - 30, finalFontSize / 3.2);
        ctx.restore();

        startAngle = endAngle;
      });

      // ขอบประดับด้านนอก
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.lineWidth = 12;
      ctx.strokeStyle = '#38bdf8';
      ctx.stroke();
    }

    // ----------------------------------------------------
    // 2. หมุนวงล้อ + ลอจิกฟิสิกส์สมูท & กิมมิคเข็มเด้ง
    // ----------------------------------------------------
    let lastSliceIndex = -1;

    function getSliceUnderPointer(rotation) {
      if (items.length === 0) return 0;
      const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
      const pointerAngle = -Math.PI / 2; 
      
      let normRot = (pointerAngle - rotation) % (Math.PI * 2);
      if (normRot < 0) normRot += Math.PI * 2;

      let accum = 0;
      for (let i = 0; i < items.length; i++) {
        const sliceAngle = (items[i].weight / totalWeight) * (Math.PI * 2);
        accum += sliceAngle;
        if (normRot <= accum) return i;
      }
      return 0;
    }

    function triggerPinBounce() {
      const pin = document.getElementById('pinPointer');
      pin.classList.remove('pin-hit');
      void pin.offsetWidth;
      pin.classList.add('pin-hit');
      playTickSound();
    }

    function spinWheel() {
      if (isSpinning || items.length === 0) return;
      initAudio();

      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('latestResult').innerHTML = '<span class="animate-pulse">🎯 กำลังสุ่มวงล้อ...</span>';

      let winnerIndex = -1;

      // 1. เช็ก % ล็อกก่อน
      const lockedItems = items.filter(item => item.lockPercent >= 0);
      const roll = Math.random() * 100;
      let chanceCutoff = 0;

      for (let lockedItem of lockedItems) {
        chanceCutoff += lockedItem.lockPercent;
        if (roll <= chanceCutoff) {
          winnerIndex = items.findIndex(item => item.id === lockedItem.id);
          break;
        }
      }

      // 2. ถ้าไม่ติด % ล็อก ให้สุ่มตาม Area Weight ปกติ
      if (winnerIndex === -1) {
        const normalItems = items.filter(item => item.lockPercent < 0);
        const totalWeight = normalItems.reduce((sum, item) => sum + item.weight, 0);
        let randomWeight = Math.random() * totalWeight;
        let accumulatedWeight = 0;

        for (let i = 0; i < items.length; i++) {
          if (items[i].lockPercent >= 0) continue;
          accumulatedWeight += items[i].weight;
          if (randomWeight <= accumulatedWeight) {
            winnerIndex = i;
            break;
          }
        }
      }

      if (winnerIndex === -1) winnerIndex = 0;
      selectedItem = items[winnerIndex];

      const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
      let startWeightSum = 0;
      for (let i = 0; i < winnerIndex; i++) {
        startWeightSum += items[i].weight;
      }
      
      const winnerStartAngle = (startWeightSum / totalWeight) * (Math.PI * 2);
      const winnerSliceAngle = (selectedItem.weight / totalWeight) * (Math.PI * 2);
      const targetAngleInSlice = winnerStartAngle + (winnerSliceAngle * (0.25 + Math.random() * 0.5));
      
      const extraRounds = (7 + Math.floor(Math.random() * 3)) * (Math.PI * 2);
      const pointerOffset = -Math.PI / 2;
      
      const targetRotation = currentRotation + extraRounds + (pointerOffset - (currentRotation % (Math.PI * 2)) - targetAngleInSlice);

      const duration = 6500;
      const startTime = performance.now();
      const initialRotation = currentRotation;
      lastSliceIndex = getSliceUnderPointer(currentRotation);

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        const easeOut = 1 - Math.pow(1 - progress, 4);
        currentRotation = initialRotation + (targetRotation - initialRotation) * easeOut;

        const currentSlice = getSliceUnderPointer(currentRotation);
        if (currentSlice !== lastSliceIndex) {
          triggerPinBounce();
          lastSliceIndex = currentSlice;
        }

        drawWheel();
        updateLEDs(true);

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          document.getElementById('spinBtn').disabled = false;
          updateLEDs(false, true);
          playWinSound();
          showResultModal(selectedItem);
        }
      }

      requestAnimationFrame(animate);
    }

    // ----------------------------------------------------
    // 3. Modal ผลลัพธ์
    // ----------------------------------------------------
    function showResultModal(item) {
      document.getElementById('modalPrizeName').innerText = item.name;
      document.getElementById('latestResult').innerHTML = `🎉 ผลลัพธ์ล่าสุด: <span class="text-yellow-400 font-bold">${item.name}</span>`;

      confetti({
        particleCount: 140,
        spread: 90,
        origin: { y: 0.6 },
        colors: ['#38bdf8', '#0284c7', '#f59e0b', '#ef4444', '#10b981']
      });

      const modal = document.getElementById('resultModal');
      const card = document.getElementById('modalCard');
      modal.classList.remove('hidden');
      setTimeout(() => {
        card.classList.remove('scale-95', 'opacity-0');
        card.classList.add('scale-100', 'opacity-100');
      }, 10);
    }

    function closeModal() {
      const modal = document.getElementById('resultModal');
      const card = document.getElementById('modalCard');
      card.classList.remove('scale-100', 'opacity-100');
      card.classList.add('scale-95', 'opacity-0');
      setTimeout(() => { 
        modal.classList.add('hidden'); 
        updateLEDs(false);
      }, 200);
    }

    // ----------------------------------------------------
    // 4. การจัดการรายการ / Drag & Drop / Edit
    // ----------------------------------------------------
    function toggleConfigModal() {
      document.getElementById('configModal').classList.toggle('hidden');
    }

    function addItem(e) {
      e.preventDefault();
      const name = document.getElementById('itemName').value;
      const weight = parseFloat(document.getElementById('itemWeight').value) || 10;
      const color = document.getElementById('itemColor').value || '#0284C7';

      items.push({
        id: Date.now(),
        name,
        weight,
        color,
        lockPercent: -1
      });

      document.getElementById('itemName').value = '';
      document.getElementById('itemWeight').value = '10';
      updateUI();
    }

    function updateItemName(id, newName) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.name = newName;
        drawWheel();
      }
    }

    function updateItemWeight(id, newWeight) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.weight = parseFloat(newWeight) || 1;
        drawWheel();
      }
    }

    function updateItemColor(id, newColor) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.color = newColor;
        drawWheel();
      }
    }

    function updateItemLockPercent(id, newLock) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.lockPercent = parseFloat(newLock) ?? -1;
      }
    }

    function removeItem(id) {
      items = items.filter(item => item.id !== id);
      updateUI();
    }

    function smartShuffleItems() {
      if (items.length <= 2) return;
      let sorted = [...items].sort((a, b) => a.weight - b.weight);
      let result = [];
      let left = 0, right = sorted.length - 1;
      
      while (left <= right) {
        if (left === right) {
          result.push(sorted[left]);
          break;
        }
        result.push(sorted[right--]);
        result.push(sorted[left++]);
      }
      
      items = result;
      updateUI();
    }

    // ----------------------------------------------------
    // 5. ระบบ EXPORT & IMPORT EXCEL
    // ----------------------------------------------------
    function exportToExcel() {
      const exportData = items.map((p) => ({
        ID: p.id,
        Name: p.name,
        Area_Weight: p.weight,
        Color_Hex: p.color,
        Lock_Percent: p.lockPercent
      }));

      const worksheet = XLSX.utils.json_to_sheet(exportData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Wheel_Config");
      XLSX.writeFile(workbook, "Wheel_Prizes_Config.xlsx");
    }

    function importFromExcel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(sheet);

        items = jsonData.map((row, index) => ({
          id: row.ID || Date.now() + index,
          name: row.Name || `รายการ ${index + 1}`,
          weight: Number(row.Area_Weight || 10),
          color: row.Color_Hex || '#0284C7',
          lockPercent: Number(row.Lock_Percent ?? -1)
        }));

        updateUI();
        alert("✅ นำเข้าข้อมูลจาก Excel เรียบร้อยแล้ว!");
      };
      reader.readAsArrayBuffer(file);
    }

    // ----------------------------------------------------
    // 6. PRESET (1, 2) & RESET
    // ----------------------------------------------------
    function savePreset(slot) {
      localStorage.setItem(`wheel_preset_${slot}`, JSON.stringify(items));
      alert(`✅ บันทึก Preset ${slot} เรียบร้อยแล้ว!`);
    }

    function loadPreset(slot) {
      const data = localStorage.getItem(`wheel_preset_${slot}`);
      if (data) {
        items = JSON.parse(data);
        updateUI();
        alert(`📂 โหลด Preset ${slot} สำเร็จ!`);
      } else {
        alert(`⚠️ ยังไม่มีข้อมูลบันทึกใน Preset ${slot}`);
      }
    }

    function resetToDefault() {
      if (confirm('ต้องการรีเซ็ตรายการกลับเป็นค่าเริ่มต้นจากไฟล์ Excel หรือไม่?')) {
        items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
        updateUI();
      }
    }

    // ----------------------------------------------------
    // 7. DRAG & DROP Implementation
    // ----------------------------------------------------
    let dragSrcIndex = null;

    function handleDragStart(e) {
      dragSrcIndex = Number(this.dataset.index);
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDrop(e) {
      e.stopPropagation();
      const targetIndex = Number(this.dataset.index);
      if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
        const movedItem = items.splice(dragSrcIndex, 1)[0];
        items.splice(targetIndex, 0, movedItem);
        updateUI();
      }
      return false;
    }

    function handleDragEnd() {
      this.classList.remove('dragging');
    }

    // ----------------------------------------------------
    // Render UI List
    // ----------------------------------------------------
    function updateUI() {
      renderItemList();
      drawWheel();
      document.getElementById('activeItemsBadge').innerText = `รวมบนวงล้อ: ${items.length} รายการ`;
    }

    function renderItemList() {
      const listEl = document.getElementById('itemList');
      listEl.innerHTML = '';

      items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'draggable-item flex items-center justify-between bg-slate-950/90 p-2 sm:p-2.5 rounded-xl border border-slate-800 text-xs gap-1.5';
        div.draggable = true;
        div.dataset.index = index;

        div.addEventListener('dragstart', handleDragStart);
        div.addEventListener('dragover', handleDragOver);
        div.addEventListener('drop', handleDrop);
        div.addEventListener('dragend', handleDragEnd);

        div.innerHTML = `
          <div class="flex items-center gap-1.5 flex-1 overflow-hidden">
            <span class="text-slate-500 font-bold cursor-grab hover:text-cyan-400">☰</span>
            <input type="color" value="${item.color}" 
                   onchange="updateItemColor(${item.id}, this.value)"
                   class="w-5 h-5 rounded cursor-pointer bg-transparent border-0 p-0">
            <input type="text" value="${item.name}" 
                   onchange="updateItemName(${item.id}, this.value)"
                   class="bg-transparent text-slate-100 font-medium px-1 py-0.5 rounded focus:bg-slate-800 focus:outline-none focus:border-cyan-500 w-full truncate border border-transparent hover:border-slate-700">
          </div>
          <div class="flex items-center gap-1.5 flex-shrink-0">
            <div class="flex items-center gap-0.5">
              <span class="text-[10px] text-slate-400">พท:</span>
              <input type="number" min="1" max="100" value="${item.weight}" 
                     onchange="updateItemWeight(${item.id}, this.value)"
                     class="w-10 bg-slate-900 border border-slate-700 text-cyan-400 font-bold rounded px-1 text-center text-xs focus:outline-none">
            </div>
            <div class="flex items-center gap-0.5" title="ใส่ -1 เพื่อคิดตามพื้นที่สุ่มปกติ หรือใส่ % ที่ต้องการล็อกให้แตกเฉพาะ">
              <span class="text-[10px] text-amber-400 font-bold">🔒%:</span>
              <input type="number" step="0.1" min="-1" max="100" value="${item.lockPercent ?? -1}" 
                     onchange="updateItemLockPercent(${item.id}, this.value)"
                     class="w-12 bg-slate-900 border border-amber-500/40 text-amber-300 font-bold rounded px-1 text-center text-xs focus:outline-none">
            </div>
            <button onclick="removeItem(${item.id})" class="text-red-400 hover:text-red-300 font-bold px-1 rounded hover:bg-red-950/50">✕</button>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    window.addEventListener('resize', () => drawWheel());
    updateUI();
  </script>
</body>
</html>
